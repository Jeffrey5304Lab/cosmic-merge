<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F4E9D7" />
    <title>Cosmic Merge</title>
    <meta name="description" content="Merge cute planets to chart real constellations — Orion, Cassiopeia and more — in a hand-drawn night sky. Grow from a meteor to the Sun." />
    <meta property="og:title" content="Cosmic Merge: Constellations" />
    <meta property="og:description" content="A hand-drawn stargazing puzzle — merge planets to light the stars of real constellations and chart the night sky." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://jeffrey5304lab.github.io/cosmic-merge/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- 字型改為自帶（見 style.css 的 @font-face），不再向 Google Fonts 取用 -->
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <h1 class="title"><span id="title-1">Cosmic </span><span id="title-2" class="title-accent">Merge</span></h1>
      </header>

      <!-- 招牌玩法：常駐星座任務。點一下打開底部 SKY 星圖 -->
      <div id="constellation" class="skybar" role="button" tabindex="0" aria-label="Constellation goal">
        <div class="skybar-text">
          <span class="skybar-label" id="cons-label">CONSTELLATION</span>
          <span class="skybar-name" id="cons-name">—</span>
        </div>
        <svg id="cons-map" class="skybar-map" viewBox="0 0 120 46" aria-hidden="true"></svg>
        <span class="skybar-progress" id="cons-progress">0/3</span>
      </div>

      <div class="stage-row">
        <aside class="side side-left">
          <div class="stat-card">
            <span id="label-score" class="hud-label">SCORE</span>
            <span id="score" class="hud-value">0</span>
          </div>
          <div class="stat-card">
            <span id="label-best" class="hud-label">BEST</span>
            <span id="best" class="hud-value">0</span>
          </div>
          <div class="stat-card best-merge-card">
            <span id="label-bestmerge" class="hud-label">TOP MERGE</span>
            <canvas id="bestmerge" width="120" height="120"></canvas>
            <span id="bestmerge-name" class="next-name">—</span>
          </div>
        </aside>
        <div id="stage" class="stage">
          <canvas id="game"></canvas>
          <div id="combo" class="combo" aria-live="polite"></div>
          <div id="discover" class="discover" aria-live="polite"></div>
          <div id="cons-banner" class="cons-banner" aria-live="polite"></div>
          <div id="tutorial" class="tutorial hidden"><p id="tutorial-text"></p></div>
          <div id="hint" class="tutorial hidden"><p id="hint-text"></p></div>
          <div id="leaderboard-modal" class="overlay hidden">
            <div class="overlay-card">
              <span id="lb-title" class="hud-label">GLOBAL TOP SCORES</span>
              <div id="lb-tabs" class="lb-tabs">
                <button id="lb-tab-global" class="lb-tab active" type="button">Global</button>
                <button id="lb-tab-mine" class="lb-tab" type="button">My country</button>
              </div>
              <div class="board">
                <ol id="lb-list"></ol>
              </div>
              <div class="overlay-actions">
                <button id="lb-close" class="btn">Close</button>
              </div>
            </div>
          </div>
          <div id="achv-modal" class="overlay hidden">
            <div class="overlay-card achv-card">
              <span class="hud-label">STATS &amp; ACHIEVEMENTS</span>
              <div id="stats-grid" class="stats-grid"></div>
              <ul id="achv-list" class="achv-list"></ul>
              <div class="overlay-actions">
                <button id="achv-close" class="btn">Close</button>
              </div>
            </div>
          </div>
          <div id="daily-modal" class="overlay hidden">
            <div class="overlay-card daily-card">
              <p class="overlay-emoji" id="daily-gift"></p>
              <span class="hud-label">DAILY REWARD</span>
              <p id="daily-streak" class="daily-streak"></p>
              <p id="daily-reward" class="daily-reward"></p>
              <p id="daily-milestone" class="daily-milestone hidden"></p>
              <div class="overlay-actions">
                <button id="daily-claim" class="btn btn-claim">Claim</button>
              </div>
            </div>
          </div>
          <div id="achv-toast" class="achv-toast" aria-live="polite"></div>
          <div id="gameover" class="overlay hidden">
            <div class="overlay-card">
              <p class="overlay-emoji" id="over-emoji"></p>
              <h2 id="over-title">The cosmos is full!</h2>
              <p class="overlay-score" id="over-score"></p>
              <p class="overlay-sub" id="over-sub"></p>
              <p class="overlay-rank hidden" id="over-rank"></p>
              <button id="revive" class="btn btn-revive">
                <span class="revive-main">Continue Playing</span>
                <span class="revive-sub">Watch a short ad · clears the top</span>
              </button>
              <input id="name-input" class="name-input" type="text" maxlength="16" placeholder="Your name" />
              <select id="country-select" class="country-select" aria-label="Country"></select>
              <button id="submit-score" class="btn btn-submit hidden">Submit to Leaderboard</button>
              <div id="best-wall" class="best-wall hidden" aria-label="Your best runs">
                <span id="best-wall-title" class="hud-label">YOUR BEST RUNS</span>
                <div id="best-wall-row" class="best-wall-row"></div>
              </div>
              <div class="board">
                <span id="board-title" class="hud-label">TOP SCORES</span>
                <ol id="board-list"></ol>
              </div>
              <div class="overlay-actions">
                <button id="share" class="btn btn-secondary">Share Score</button>
                <button id="restart" class="btn">Play Again</button>
              </div>
            </div>
          </div>
        </div>
        <aside class="side side-right">
          <div class="next-card">
            <span id="label-next" class="hud-label">NEXT</span>
            <canvas id="next" width="120" height="120"></canvas>
            <span id="next-name" class="next-name"></span>
          </div>
          <button id="hammer" class="btn btn-ghost btn-icon" aria-label="Hammer (smash one planet)">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="6.2" y="3.8" width="11.6" height="6" rx="2" fill="var(--honey)" />
              <path d="M11.6 9.8 C11.5 13 11.6 16.4 11.9 19.6 C11.9 20.1 12.5 20.1 12.5 19.6 C12.7 16.4 12.6 13 12.4 9.8" fill="var(--honey)" />
            </svg>
            <span id="hammer-count" class="count">1</span>
          </button>
          <button id="leaderboard-btn" class="btn btn-ghost btn-icon" aria-label="Leaderboard">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 4.5 H17 V8 C17 11 14.8 13 12 13 C9.2 13 7 11 7 8 Z" fill="var(--honey)" />
              <path d="M7 5.6 C4.3 5.6 4.3 9.2 7.4 9.5" fill="none" />
              <path d="M17 5.6 C19.7 5.6 19.7 9.2 16.6 9.5" fill="none" />
              <path d="M12 13 V16.8" fill="none" />
              <path d="M8.8 19.8 H15.2 L14 16.8 H10 Z" fill="var(--honey)" />
            </svg>
          </button>
          <button id="achv-btn" class="btn btn-ghost btn-icon" aria-label="Stats & achievements">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3.6 L14.5 8.7 L20.1 9.5 L16 13.4 L17 19 L12 16.3 L7 19 L8 13.4 L3.9 9.5 L9.5 8.7 Z" fill="var(--honey)" />
            </svg>
          </button>
          <button id="mute" class="btn btn-ghost btn-icon" aria-label="Toggle sound">
            <svg class="icon-sound-on" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4.6 9.5 H7.8 L12.2 5.7 V18.3 L7.8 14.5 H4.6 Z" />
              <path d="M15.2 9.2 C16.7 10.8 16.7 13.2 15.2 14.8" />
              <path d="M17.9 7 C20.4 9.6 20.4 14.4 17.9 17" />
            </svg>
            <svg class="icon-sound-off" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4.6 9.5 H7.8 L12.2 5.7 V18.3 L7.8 14.5 H4.6 Z" />
              <path d="M15.8 9.8 L20.1 14.2" />
              <path d="M20.1 9.8 L15.8 14.2" />
            </svg>
          </button>
        </aside>
      </div>

      <footer class="evolution">
        <div class="chart-tabs">
          <button id="tab-evolution" class="chart-tab active" type="button">EVOLUTION</button>
          <button id="tab-stars" class="chart-tab" type="button">STARS</button>
          <button id="tab-sky" class="chart-tab" type="button">SKY</button>
        </div>
        <canvas id="chart" width="640" height="72"></canvas>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
